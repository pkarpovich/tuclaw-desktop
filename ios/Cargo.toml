[package]
name = "tuclaw-ios"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
gpui.workspace = true
gpui-kit.workspace = true
tuclaw-core = { path = "../core" }
tuclaw-desktop = { path = "../app" }
libc = "=0.2.189"
time = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa", default-features = false, features = ["camera", "video_player"] }
log = "0.4"

[[test]]
name = "visual"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures = "0.3.34"
serde_json = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
tuclaw-desktop = { path = "../app", features = ["test-support"] }
