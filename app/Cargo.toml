[package]
name = "tuclaw-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = "0.3.34"
gpui.workspace = true
gpui_platform.workspace = true
gpui-kit.workspace = true
time = { workspace = true }
tuclaw-core = { path = "../core" }
opus-pure = "0.2.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString", "NSURL", "NSValue", "NSError"] }
objc2-avf-audio = { version = "0.3.2", features = ["AVAudioRecorder", "AVAudioSettings"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
