[package]
name = "tuclaw-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = "0.3.34"
gpui.workspace = true
gpui-kit.workspace = true
time = { workspace = true }
jiff = "0.2.37"
markdown = "=1.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tuclaw-core = { path = "../core" }
opus-pure = "0.2.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform.workspace = true
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSDictionary", "NSString", "NSURL", "NSValue", "NSError"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSSound"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6.2"
objc2-avf-audio = { version = "0.3.2", features = ["AVAudioRecorder", "AVAudioSettings"] }
objc2-image-io = { version = "0.3.2", features = ["CGImageSource", "CGImageDestination", "CGImageProperties"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[[test]]
name = "visual"
harness = false
