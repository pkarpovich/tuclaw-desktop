[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy", targets = "aarch64-apple-ios-sim,aarch64-apple-ios" }

[tasks.build]
description = "Build the workspace, tests included"
run = "cargo build --workspace --all-targets"

[tasks.dev]
description = "Build and run the app"
run = "cargo run -p tuclaw-desktop"

[tasks.snapshot]
description = "Render the app offscreen to target/snapshots/<channel>.png (mock, or TUCLAW_MOCK_WORLD)"
run = "cargo run -q -p tuclaw-desktop --example snapshot --"

[tasks.test]
description = "Run both test tiers"
run = "cargo test --workspace"

[tasks.visual]
description = "Render the visual scenes and compare them with app/tests/visual (UPDATE_BASELINE=1 rewrites them)"
run = "cargo test -p tuclaw-desktop --test visual"

[tasks.lint]
description = "Clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Fail on unformatted code"
run = "cargo fmt --all -- --check"

[tasks.bundle]
description = "Build target/release/bundle/Tuclaw Preview.app (ad-hoc signed, its own bundle id)"
run = "fish script/bundle-mac.fish"

[tasks.preview]
description = "Build Tuclaw Preview.app and open it, quitting a running preview first"
run = "fish script/bundle-mac.fish --open"

[tasks.install]
description = "Build Tuclaw Preview.app and copy it to /Applications"
run = "fish script/bundle-mac.fish --install"

[tasks.snapshot-world]
description = "Turn a prod snapshot DB into the mock's world.json (outside git)"
run = "python3 script/snapshot-world.py"

[tasks.ios-build]
description = "Build the iPhone app for the simulator (target/ios/build/.../Tuclaw.app); --release for an optimised build"
run = "fish script/ios.fish"

[tasks.ios-run]
description = "Build the iPhone app and launch it on the 'Tuclaw iPhone 17 Pro' simulator (iOS 26.5), creating it if missing"
run = "fish script/ios.fish --run"

[tasks.ios-mock]
description = "The same as ios-run, with the app on the built-in mock daemon instead of bravo"
run = "fish script/ios.fish --run --mock"

[tasks.ios-lint]
description = "Clippy for the iPhone app on the simulator target, warnings as errors"
run = "cargo clippy -p tuclaw-ios --lib --target aarch64-apple-ios-sim -- -D warnings"
