[tools]
rust = "1.98.1"

[tasks.build]
description = "Build the workspace, tests included"
run = "cargo build --workspace --all-targets"

[tasks.dev]
description = "Build and run the app"
run = "cargo run -p tuclaw-desktop"

[tasks.snapshot]
description = "Render the app offscreen to target/snapshots/<channel>.png (mock, or TUCLAW_MOCK_WORLD)"
run = "cargo run -q -p tuclaw-desktop --example snapshot --"

[tasks.test]
description = "Run both test tiers"
run = "cargo test --workspace"

[tasks.lint]
description = "Clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Fail on unformatted code"
run = "cargo fmt --all -- --check"

[tasks.bundle]
description = "Build target/release/bundle/Tuclaw.app (ad-hoc signed)"
run = "fish script/bundle-mac.fish"

[tasks.preview]
description = "Build Tuclaw.app and open it, quitting a running bundle first"
run = "fish script/bundle-mac.fish --open"

[tasks.install]
description = "Build Tuclaw.app and copy it to /Applications"
run = "fish script/bundle-mac.fish --install"

[tasks.snapshot-world]
description = "Turn a prod snapshot DB into the mock's world.json (outside git)"
run = "python3 script/snapshot-world.py"
